<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>By.Nii – Konfirmasi via WhatsApp</title>
<style>
:root{--bg:#fff5f9;--fg:#3b0a22;--muted:#9d5c78;--card:#fff;--line:#fbcfe0;--btn-bg:#ec4899;--btn-fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
.wrap{width:100%;max-width:400px;text-align:center}
.logo{width:88px;height:88px;border-radius:22px;background:#ec4899;border:1px solid var(--line);margin:0 auto 20px;display:block}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px}
p{color:var(--muted);margin:0 0 28px;line-height:1.5;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--btn-bg);color:var(--btn-fg);text-decoration:none;font-weight:600;font-size:17px;padding:18px;border-radius:16px}
.btn:active{transform:scale(.98)}
.note{margin-top:14px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <svg class="logo" viewBox="0 0 40 40" aria-label="Logo By.Nii">
    <path d="M12 29V11l16 18V11" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    
  </svg>
  <h1>By.Nii</h1>
  <p>Udah Ngeclue? Jangan Lupa Konfirmasi Ke WA Ya Kak, Sebut Username TikTok-nya 💕</p>
  <a class="btn" href="https://wa.me/6285117531906?text=Hallo%20kka%20aku%20mau%20konfir%20dengan%20username%20%3A%20">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20l1.2-4A8.5 8.5 0 1 1 8 18.800z"/></svg>
    Konfirmasi via WhatsApp
  </a>
  <div class="note">Biasanya dibalas dalam hitungan menit</div>
</main>
</body>
</html>
